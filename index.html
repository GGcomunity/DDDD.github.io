<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Кирилл: Побег от ТЦК</title>
<style>
html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
#wrap{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;font-size:10px}
canvas{display:block}
.overlay{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;pointer-events:none}
.overlay.hidden{display:none}
#menu{justify-content:center}
#over{justify-content:flex-start;padding-top:4%}
.panel{pointer-events:auto;background:rgba(9,15,40,.58);border:.25em solid rgba(255,255,255,.28);border-radius:1.8em;padding:1.6em 3em 2em;box-shadow:0 .6em 3em rgba(0,0,0,.35)}
h1{margin:0 0 .35em;font-size:4.6em;line-height:1.05;letter-spacing:.02em;text-shadow:0 .08em 0 #7a1d12,0 .16em .5em rgba(0,0,0,.5);color:#ffd84d}
h1 span{display:block;font-size:.72em;color:#fff}
h2{margin:0 0 .3em;font-size:4.2em;color:#ff5a4d;text-shadow:0 .08em 0 #4a0f0a,0 .15em .45em rgba(0,0,0,.5);letter-spacing:.03em}
.line{font-size:2.1em;margin:.2em 0;text-shadow:0 .06em .2em rgba(0,0,0,.6)}
.line b{color:#ffd84d;font-family:"Courier New",monospace;font-size:1.15em}
.new{font-size:2em;color:#7dffb0;font-weight:bold;margin:.1em 0 .2em;text-shadow:0 .06em .2em rgba(0,0,0,.6)}
.hint{font-size:1.45em;opacity:.85;margin-top:1em}
button{pointer-events:auto;cursor:pointer;margin-top:.8em;font:inherit;font-weight:bold;font-size:2.8em;color:#3a1a00;background:linear-gradient(#ffe46b,#ffb400);border:.1em solid #7a4a00;border-radius:.6em;padding:.25em 1.4em;box-shadow:0 .2em 0 #a56a00,0 .4em 1em rgba(0,0,0,.4);transition:transform .08s}
button:hover{transform:translateY(-.06em)}
button:active{transform:translateY(.12em);box-shadow:0 .08em 0 #a56a00}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="menu" class="overlay">
      <div class="panel">
        <h1>Кирилл:<span>Побег от ТЦК</span></h1>
        <div class="line">Рекорд: <b id="menuHi">00000</b></div>
        <button id="btnPlay" type="button">Играть</button>
        <div class="hint">Пробел, ↑, W или касание экрана — прыжок</div>
      </div>
    </div>
    <div id="over" class="overlay hidden">
      <div class="panel">
        <h2>ИГРА ОКОНЧЕНА</h2>
        <div class="new" id="ovNew" style="display:none">НОВЫЙ РЕКОРД!</div>
        <div class="line">Очки: <b id="ovScore">00000</b></div>
        <div class="line">Рекорд: <b id="ovHi">00000</b></div>
        <button id="btnAgain" type="button">Играть снова</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

/* ======================= КОНСТАНТЫ ======================= */
var LH = 400;                 // логическая высота сцены
var GY = 366;                 // линия дороги, на которой стоят колёса
var SW_TOP = 332, SW_BOT = 344; // тротуар
var TRUCK_X = 70, TRUCK_L = 132;
var V0 = 380, VMAX = 840;
var JV = 1040, GRAV = 2400;   // скорость прыжка и гравитация
var TAU = Math.PI * 2;
var HI_KEY = 'kirill_ujh_record';

/* ======================= УТИЛИТЫ ======================= */
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function rint(a, b) { return Math.floor(rnd(a, b + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function hash(a, b, c) {
  var h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
var _rgb = {};
function rgb(h) {
  var v = _rgb[h];
  if (!v) {
    var s = h.slice(1);
    if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
    var n = parseInt(s, 16);
    v = _rgb[h] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  return v;
}
function mixArr(a, b, t) { var A = rgb(a), B = rgb(b); return [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]; }
function arrStr(v, al) {
  return al === undefined ? 'rgb(' + Math.round(v[0]) + ',' + Math.round(v[1]) + ',' + Math.round(v[2]) + ')'
    : 'rgba(' + Math.round(v[0]) + ',' + Math.round(v[1]) + ',' + Math.round(v[2]) + ',' + al + ')';
}
function mix(a, b, t) { return arrStr(mixArr(a, b, t)); }
var N = 0; // текущая «ночность» 0..1
function C(d, n) { return mix(d, n, N); }
function OUT() { return C('#2b2f45', '#05060c'); }
function pad5(n) { n = Math.floor(n); var s = String(n); while (s.length < 5) s = '0' + s; return s; }

function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
function starPath(c, cx, cy, R, r, rot) {
  c.beginPath();
  for (var i = 0; i < 10; i++) {
    var a = rot + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r : R;
    var x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
    if (i) c.lineTo(x, y); else c.moveTo(x, y);
  }
  c.closePath();
}
function poly(c, pts) {
  c.beginPath(); c.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
  c.closePath();
}
/* сетка окон: y0 — верх (меньше), y1 — низ */
function windowsGrid(c, x0, y0, x1, y1, cw, ch, ww, wh, seed, offCol, litCol, pLit) {
  var nc = Math.floor((x1 - x0) / cw), nr = Math.floor((y1 - y0) / ch);
  for (var pass = 0; pass < 2; pass++) {
    c.beginPath();
    for (var r = 0; r < nr; r++) for (var q = 0; q < nc; q++) {
      var lit = hash(seed, r, q) < pLit;
      if (lit !== (pass === 1)) continue;
      c.rect(x0 + q * cw + (cw - ww) / 2, y0 + r * ch + (ch - wh) / 2, ww, wh);
    }
    c.fillStyle = pass ? litCol : offCol; c.fill();
  }
}

/* ======================= DOM ======================= */
var cvs = document.getElementById('c');
var ctx = cvs.getContext('2d');
var stage = document.getElementById('stage');
var elMenu = document.getElementById('menu');
var elOver = document.getElementById('over');
var elMenuHi = document.getElementById('menuHi');
var elOvScore = document.getElementById('ovScore');
var elOvHi = document.getElementById('ovHi');
var elOvNew = document.getElementById('ovNew');

var W = 800, scale = 1, dpr = 1;
var hi = 0;
try { hi = parseInt(localStorage.getItem(HI_KEY), 10) || 0; } catch (e) {}
function saveHi() { try { localStorage.setItem(HI_KEY, String(hi)); } catch (e) {} }

/* ======================= СОСТОЯНИЕ ======================= */
var G = {
  state: 'menu', t: 0, score: 0, speed: 220, nf: 0, nightTarget: 0, period: 0,
  bannerText: '', bannerT: 0, jumpBuf: 0, spawnDist: 0, nextGap: 600, lastKind: '', planeStreak: 0,
  road: 0, deathT: 0, deathEnd: 2.2, deathObs: null, overT: 0, canRestart: false, newRec: false, shake: 0,
  dustT: 0, smokeT: 0
};
var T = { x: TRUCK_X, jumpY: 0, vy: 0, onGround: true, wheel: 0, sp: 0, spv: 0, pitch: 0, kirill: true, expr: 'normal', tx: TRUCK_X };
var K = null;                  // Кирилл, вылетевший из кабины
var obs = [], parts = [], clouds = [], stars = [], sideItems = [], specks = [];
var TXT_FS = 34;

/* ======================= ПУТИ (Path2D) ======================= */
function hwE(y) { return 4 + 31 * Math.pow(Math.max(0, 1 - y / 140), 2.4); }
var EIFFEL = new Path2D();
(function () {
  var y;
  EIFFEL.moveTo(35 - hwE(0), 0);
  for (y = 4; y <= 132; y += 4) EIFFEL.lineTo(35 - hwE(y), -y);
  EIFFEL.lineTo(34, -140); EIFFEL.lineTo(36, -140);
  for (y = 132; y >= 0; y -= 4) EIFFEL.lineTo(35 + hwE(y), -y);
  EIFFEL.closePath();
  EIFFEL.moveTo(21, 0); EIFFEL.lineTo(21, -8); EIFFEL.ellipse(35, -8, 14, 18, 0, Math.PI, TAU); EIFFEL.lineTo(49, 0); EIFFEL.closePath();
})();

function hwTV(y) { return 3 + 11 * Math.pow(Math.max(0, 1 - y / 90), 2); }
var TVP = new Path2D(), TVPOD = new Path2D();
(function () {
  var cx = 18, y;
  TVP.moveTo(cx - hwTV(0), 0);
  for (y = 4; y <= 90; y += 4) TVP.lineTo(cx - hwTV(y), -y);
  TVP.lineTo(cx - 2.4, -104); TVP.lineTo(cx - 1.3, -104); TVP.lineTo(cx - 1.1, -138); TVP.lineTo(cx + 1.1, -138);
  TVP.lineTo(cx + 1.3, -104); TVP.lineTo(cx + 2.4, -104);
  for (y = 90; y >= 0; y -= 4) TVP.lineTo(cx + hwTV(y), -y);
  TVP.closePath();
  TVPOD.moveTo(cx - 6, -70); TVPOD.lineTo(cx - 13, -76); TVPOD.lineTo(cx - 13, -82); TVPOD.lineTo(cx - 6, -88);
  TVPOD.lineTo(cx + 6, -88); TVPOD.lineTo(cx + 13, -82); TVPOD.lineTo(cx + 13, -76); TVPOD.lineTo(cx + 6, -70); TVPOD.closePath();
})();

function hwG(y) { return 22 * Math.sqrt(Math.max(0, 1 - Math.pow((y - 52) / 62, 2))); }
var GHER = new Path2D();
(function () {
  var y;
  GHER.moveTo(22 - hwG(0), 0);
  for (y = 3; y <= 114; y += 3) GHER.lineTo(22 - hwG(y), -y);
  for (y = 111; y >= 0; y -= 3) GHER.lineTo(22 + hwG(y), -y);
  GHER.closePath();
})();

function slabsFromProfile(hw, cx, h, step, k) {
  var s = [];
  for (var y0 = 0; y0 < h; y0 += step) {
    var y1 = Math.min(h, y0 + step);
    var m = Math.max(hw(y0), hw(y1)) * k;
    s.push([cx - m, cx + m, y0, y1]);
  }
  return s;
}

/* ======================= ГОЛОВА И ТЕЛО КИРИЛЛА ======================= */
function drawHead(c, cx, cy, r, expr) {
  // волосы сзади
  c.fillStyle = '#6b3f1f';
  c.beginPath(); c.arc(cx - 2, cy + 1, r + 0.9, Math.PI * 0.5, Math.PI * 1.55); c.fill();
  // лицо
  c.fillStyle = '#f7c9a0'; c.strokeStyle = '#3a2414'; c.lineWidth = 1.2;
  c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.fill(); c.stroke();
  // ухо
  c.fillStyle = '#eab088'; c.beginPath(); c.arc(cx - r * 0.38, cy + 1.2, r * 0.2, 0, TAU); c.fill();
  // румянец
  c.fillStyle = 'rgba(255,110,110,.38)'; c.beginPath(); c.arc(cx + r * 0.32, cy + r * 0.42, r * 0.2, 0, TAU); c.fill();
  // нос
  c.fillStyle = '#efae84'; c.beginPath(); c.arc(cx + r * 0.96, cy + r * 0.12, r * 0.19, 0, TAU); c.fill();
  var ex = cx + r * 0.4, ey = cy - r * 0.1;
  if (expr === 'dead') {
    c.strokeStyle = '#20120a'; c.lineWidth = 1.5; var s = r * 0.24;
    c.beginPath(); c.moveTo(ex - s, ey - s); c.lineTo(ex + s, ey + s); c.moveTo(ex + s, ey - s); c.lineTo(ex - s, ey + s); c.stroke();
  } else if (expr === 'jump') {
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ex, ey, r * 0.38, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = '#111'; c.beginPath(); c.arc(ex + r * 0.1, ey, r * 0.19, 0, TAU); c.fill();
  } else {
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ex, ey, r * 0.3, 0, TAU); c.fill(); c.lineWidth = 1; c.stroke();
    c.fillStyle = '#111'; c.beginPath(); c.arc(ex + r * 0.1, ey, r * 0.15, 0, TAU); c.fill();
  }
  // бровь
  c.strokeStyle = '#4a2a12'; c.lineWidth = 1.5; c.beginPath();
  if (expr === 'dead') { c.moveTo(ex - r * 0.3, ey - r * 0.42); c.lineTo(ex + r * 0.35, ey - r * 0.3); }
  else { c.moveTo(ex - r * 0.3, ey - r * 0.4); c.lineTo(ex + r * 0.35, ey - r * 0.48); }
  c.stroke();
  // рот
  c.strokeStyle = '#5a2a1a'; c.lineWidth = 1.4;
  if (expr === 'jump') {
    c.fillStyle = '#5a1f1a'; c.beginPath(); c.ellipse(cx + r * 0.45, cy + r * 0.5, r * 0.2, r * 0.3, 0, 0, TAU); c.fill();
  } else if (expr === 'dead') {
    c.beginPath(); c.moveTo(cx + r * 0.1, cy + r * 0.55); c.lineTo(cx + r * 0.3, cy + r * 0.45); c.lineTo(cx + r * 0.5, cy + r * 0.58); c.lineTo(cx + r * 0.7, cy + r * 0.48); c.stroke();
  } else {
    c.beginPath(); c.arc(cx + r * 0.36, cy + r * 0.28, r * 0.4, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
  }
  // кепка
  c.fillStyle = '#ff7a1a'; c.strokeStyle = '#7a3300'; c.lineWidth = 1.2;
  c.beginPath(); c.arc(cx, cy - r * 0.15, r + 0.7, Math.PI, TAU); c.closePath(); c.fill(); c.stroke();
  poly(c, [cx + 1, cy - r * 0.32, cx + r + 8, cy - r * 0.2, cx + r + 8, cy - r * 0.02, cx + 1, cy - r * 0.04]);
  c.fillStyle = '#e25f00'; c.fill(); c.stroke();
  c.fillStyle = '#ffd84d'; c.beginPath(); c.arc(cx, cy - r * 1.15, 1.6, 0, TAU); c.fill();
}

function drawKirillBody(c, x, y, rot, expr, limp, tt) {
  c.save(); c.translate(x, y); c.rotate(rot);
  var la = 0.12 + Math.sin(tt * 5) * limp, lb = -0.1 + Math.sin(tt * 5 + 1.7) * limp;
  var aa = 0.25 + Math.sin(tt * 4 + 0.6) * limp * 1.3, ab = -0.2 + Math.sin(tt * 4 + 2.2) * limp * 1.3;
  c.lineCap = 'round';
  // ноги
  c.strokeStyle = '#26345e'; c.lineWidth = 6;
  c.beginPath(); c.moveTo(-3, 12); c.lineTo(-3 + Math.sin(la) * 20, 12 + Math.cos(la) * 20); c.stroke();
  c.beginPath(); c.moveTo(3, 12); c.lineTo(3 + Math.sin(lb) * 20, 12 + Math.cos(lb) * 20); c.stroke();
  c.fillStyle = '#f2f2f2'; c.strokeStyle = '#222'; c.lineWidth = 1;
  c.beginPath(); c.ellipse(-3 + Math.sin(la) * 21, 12 + Math.cos(la) * 21 + 1, 5, 3, 0, 0, TAU); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(3 + Math.sin(lb) * 21 + 2, 12 + Math.cos(lb) * 21 + 1, 5, 3, 0, 0, TAU); c.fill(); c.stroke();
  // туловище
  rrect(c, -8, -9, 16, 24, 5); c.fillStyle = '#2f8fd9'; c.fill(); c.strokeStyle = '#123a5e'; c.lineWidth = 1.2; c.stroke();
  c.fillStyle = '#ffd84d'; c.fillRect(-8, 6, 16, 3);
  // руки
  c.strokeStyle = '#2f8fd9'; c.lineWidth = 5;
  c.beginPath(); c.moveTo(0, -5); c.lineTo(Math.sin(aa) * 16, -5 + Math.cos(aa) * 16); c.stroke();
  c.beginPath(); c.moveTo(0, -5); c.lineTo(Math.sin(ab) * 16, -5 + Math.cos(ab) * 16); c.stroke();
  c.fillStyle = '#f7c9a0';
  c.beginPath(); c.arc(Math.sin(aa) * 17, -5 + Math.cos(aa) * 17, 3, 0, TAU); c.fill();
  c.beginPath(); c.arc(Math.sin(ab) * 17, -5 + Math.cos(ab) * 17, 3, 0, TAU); c.fill();
  drawHead(c, 3, -19, 10, expr);
  c.restore();
}

/* ======================= ГРУЗОВИК ======================= */
function drawWheel(c, x, y, ang) {
  c.fillStyle = '#15151a'; c.beginPath(); c.arc(x, y, 13, 0, TAU); c.fill();
  c.strokeStyle = '#2f2f39'; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, 11.2, 0, TAU); c.stroke();
  c.fillStyle = C('#cfd4de', '#8a90a0'); c.beginPath(); c.arc(x, y, 7.6, 0, TAU); c.fill();
  c.strokeStyle = '#6a7080'; c.lineWidth = 1; c.stroke();
  c.fillStyle = '#5a6070';
  for (var i = 0; i < 5; i++) {
    var a = ang + i * TAU / 5;
    c.beginPath(); c.arc(x + Math.cos(a) * 4.8, y + Math.sin(a) * 4.8, 1.1, 0, TAU); c.fill();
  }
  c.strokeStyle = '#8a909f'; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(x + Math.cos(ang) * 7, y + Math.sin(ang) * 7); c.lineTo(x - Math.cos(ang) * 7, y - Math.sin(ang) * 7); c.stroke();
  c.fillStyle = '#7a8190'; c.beginPath(); c.arc(x, y, 2.4, 0, TAU); c.fill();
}

function drawTruck(c, o) {
  c.save();
  c.translate(o.x + 66, o.y - 14);
  c.rotate(o.pitch);
  c.translate(-66, 14 + o.bob);
  var out = '#2a1a10';
  // шасси
  c.fillStyle = '#23232d'; rrect(c, 6, -24, 122, 8, 2); c.fill();
  // кузов
  var g = c.createLinearGradient(0, -78, 0, -20);
  g.addColorStop(0, C('#ffe066', '#d9ad2c')); g.addColorStop(1, C('#f2b705', '#a97f0e'));
  rrect(c, 0, -78, 86, 58, 4); c.fillStyle = g; c.fill();
  c.lineWidth = 1.6; c.strokeStyle = '#5a4300'; c.stroke();
  c.fillStyle = '#1b2a52'; c.fillRect(1.5, -76, 83, 3); c.fillRect(1.5, -25, 83, 3);
  c.strokeStyle = 'rgba(120,80,0,.28)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(5, -72); c.lineTo(5, -26); c.moveTo(81, -72); c.lineTo(81, -26); c.stroke();
  // надпись ТЦК
  c.font = '900 ' + TXT_FS + 'px "Arial Black",Impact,Arial,sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.lineWidth = 5; c.strokeStyle = '#ffffff';
  c.strokeText('ТЦК', 43, -49);
  c.fillStyle = '#12204a'; c.fillText('ТЦК', 43, -49);
  c.lineJoin = 'miter';
  // салон и Кирилл
  var win = [94, -69, 109, -69, 119, -50, 119, -43, 94, -43];
  poly(c, win); c.fillStyle = '#2b2230'; c.fill();
  c.save(); poly(c, win); c.clip();
  if (o.kirill) {
    rrect(c, 96, -44, 18, 14, 4); c.fillStyle = '#2f8fd9'; c.fill();
    drawHead(c, 106, -55, 11, o.expr);
  } else {
    c.fillStyle = '#4a3a50'; c.fillRect(96, -52, 10, 12);
  }
  c.restore();
  // кабина
  var cg = c.createLinearGradient(0, -76, 0, -20);
  cg.addColorStop(0, C('#ee4a3d', '#a8322a')); cg.addColorStop(1, C('#c92d22', '#7e211b'));
  c.beginPath();
  c.moveTo(88, -20); c.lineTo(88, -72); c.quadraticCurveTo(88, -75, 91, -75); c.lineTo(111, -75); c.lineTo(123, -47);
  c.lineTo(130, -45); c.lineTo(132, -41); c.lineTo(132, -24); c.lineTo(129, -20); c.closePath();
  c.moveTo(94, -69); c.lineTo(109, -69); c.lineTo(119, -50); c.lineTo(119, -43); c.lineTo(94, -43); c.closePath();
  c.fillStyle = cg; c.fill('evenodd'); c.strokeStyle = out; c.lineWidth = 1.5; c.stroke();
  // стекло
  poly(c, win); c.fillStyle = 'rgba(190,230,255,' + (0.2 - N * 0.1) + ')'; c.fill();
  c.fillStyle = 'rgba(255,255,255,.28)'; poly(c, [97, -43, 102, -43, 111, -69, 106, -69]); c.fill();
  // дверь, ручка, зеркало
  c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(110, -42); c.lineTo(110, -24); c.moveTo(94, -42); c.lineTo(94, -24); c.stroke();
  c.fillStyle = '#e8ecf2'; c.fillRect(102, -39, 6, 2.5);

function spawnObstacle() {

    obs.push({ kind: 'p', x: x, alt: alt, baseAlt: alt, w: 88, seed: rint(1, 99999), ph: Math.random(), rot: 0, dead: false, fvy: 0, hit: false, bob: 0 });
    totalW = 88; G.planeStreak++; G.lastKind = 'p'; extra = 0.2 * v;
  } else {
    var t, tries = 0;
    do { t = pick(OB); tries++; } while (t.id === G.lastType && tries < 6);
    var o = { kind: 'b', type: t, x: x, w: t.w, seed: rint(1, 99999), hit: false };
    obs.push(o); totalW = t.w; G.lastType = t.id; G.planeStreak = 0;

      var t2 = pick(cand);

      totalW += 8 + t2.w; G.lastType = t2.id;

function updateTruckPhysics(dt, v) {

  if (G.state === 'playing' && T.onGround && G.jumpBuf > 0) {
    T.vy = JV; T.onGround = false; G.jumpBuf = 0; T.spv -= 40;
    dust(T.x + 30, GY - 2, -v * 0.2, 5);

  if (!T.onGround) {

  T.pitch += (target - T.pitch) * Math.min(1, dt * 12);

}

function updateWorld(dt, v) {
  G.t += dt;
  G.road += v * dt;
  moveLayer(layers.far, v * layers.far.f * dt);
  moveLayer(layers.mid, v * layers.mid.f * dt);
  moveLayer(layers.near, v * layers.near.f * dt);

  for (i = 0; i < sideItems.length; i++) sideItems[i].x -= v * dt;

  }

  if (G.bannerT > 0) G.bannerT -= dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);

}

function updatePlaying(dt) {
  var target = Math.min(VMAX, V0 + G.score * 0.18);

  var v = G.speed;

  }

  G.smokeT -= dt; if (G.smokeT <= 0) { G.smokeT = 0.12; smoke(T.x + 91, GY - T.jumpY - 92, -v * 0.35, '120,120,128'); }
  // препятствия

}

function startDeath(ob) {

  var sc = Math.floor(G.score);

function updateDying(dt) {

  var d = G.deathT, ob = G.deathObs;

    smoke(ob.x + 80, GY - ob.alt - 30, 40, '40,40,46');

      for (var j2 = 0; j2 < 8; j2++) addPart({ x: ob.x + 40, y: GY - 4, vx: rnd(-120, 120), vy: rnd(-200, -40), life: rnd(0.3, 0.5), max: 0.5, r: rnd(3, 5), col: '255,170,60', g: 300, grow: -4 });

      G.smokeT -= dt; if (G.smokeT <= 0) { G.smokeT = 0.16; smoke(T.x + 91, GY - T.jumpY - 92, -v * 0.35, '120,120,128'); }

    drawKirillBody(c, K.x, K.y, K.rot, 'dead', K.mode === 'stuck' ? 0.35 : 0.9, K.tt);
  }
  drawTruck(c, { x: T.x, y: GY - T.jumpY, pitch: T.pitch, bob: T.sp + (T.onGround && G.state !== 'dying' ? Math.sin(G.t * 18) * 0.7 : 0), wheel: T.wheel, kirill: T.kirill, expr: T.expr });
  if (K && (K.mode === 'ball' || K.mode === 'down')) {
    var lying = K.mode === 'down';
    drawKirillBody(c, K.x, lying ? GY - 9 : K.y, K.rot, 'dead', lying ? 0.2 : 1.1, K.tt);
    if (lying) { for (i = 0; i < 3; i++) { var a = G.t * 3 + i * TAU / 3; c_star(K.x + 12 + Math.cos(a) * 16, GY - 38 + Math.sin(a) * 4, a); } }
  }
  drawStuckKirill(c);
  // свет фар
  if (N > 0.05) {
    var fx = T.x + 133, fy = GY - T.jumpY - 34;
    c.save(); c.globalCompositeOperation = 'lighter';
    var lg = c.createLinearGradient(fx, 0, fx + 300, 0);
    lg.addColorStop(0, 'rgba(255,240,170,' + (0.5 * N) + ')'); lg.addColorStop(1, 'rgba(255,240,170,0)');
    c.fillStyle = lg; c.beginPath(); c.moveTo(fx, fy - 3); c.lineTo(fx + 300, fy - 52); c.lineTo(fx + 300, fy + 40); c.lineTo(fx, fy + 3); c.closePath(); c.fill();
    c.restore();
  }
  c.restore();
  drawHUD(c);
  drawBanner(c);
}

/* ======================= РАЗМЕР ОКНА ======================= */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  var vw = window.innerWidth || 800, vh = window.innerHeight || 450;
  W = clamp(Math.round(LH * vw / vh), 640, 1280);
  scale = Math.min(vw / W, vh / LH);
  var cw = Math.floor(W * scale), ch = Math.floor(LH * scale);
  cvs.style.width = cw + 'px'; cvs.style.height = ch + 'px';
  stage.style.width = cw + 'px'; stage.style.height = ch + 'px';
  stage.style.fontSize = (scale * 10) + 'px';
  cvs.width = Math.max(1, Math.floor(cw * dpr)); cvs.height = Math.max(1, Math.floor(ch * dpr));
  fillLayer(layers.far); fillLayer(layers.mid); fillLayer(layers.near); fillSide();
}

/* ======================= ВВОД ======================= */
window.addEventListener('keydown', function (e) {
  var k = e.code;
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW' || k === 'ArrowDown') e.preventDefault();
  if (e.repeat) return;
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') pressJump();
  else if (k === 'Enter' && (G.state === 'menu' || (G.state === 'over' && G.canRestart))) startGame();
});
cvs.addEventListener('pointerdown', function (e) { e.preventDefault(); pressJump(); });
document.getElementById('btnPlay').addEventListener('click', function (e) { e.stopPropagation(); startGame(); });
document.getElementById('btnAgain').addEventListener('click', function (e) { e.stopPropagation(); if (G.canRestart) startGame(); });
document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

/* ======================= СТАРТ ======================= */
function measureText() {
  ctx.font = '900 40px "Arial Black",Impact,Arial,sans-serif';
  var w = ctx.measureText('ТЦК').width || 90;
  TXT_FS = Math.min(38, 40 * 70 / w);
}
var last = 0;
function frame(ts) {
  var dt = last ? Math.min(0.033, (ts - last) / 1000) : 0.016;
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
initSky(); measureText(); resize();
elMenuHi.textContent = pad5(hi);
G.state = 'menu'; showOverlays();
requestAnimationFrame(frame);

})();
</script>
